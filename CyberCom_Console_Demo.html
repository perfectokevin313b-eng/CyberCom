<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071824"><title>CyberCom Console · Demo</title><style>
:root{--bg:#071824;--panel:#102a38;--line:#ffffff20;--white:#f2f7f5;--muted:#9bb0b9;--lime:#c7f36b;--teal:#75e2cf;--amber:#ffba77}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--white);font:14px 'Segoe UI',Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}.layout{min-height:100vh;display:grid;grid-template-columns:220px 1fr}.side{background:#091b27;border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:10px;padding:5px 7px 22px;border-bottom:1px solid var(--line)}.brand img{width:48px;height:42px;object-fit:contain;background:#fff;border-radius:5px;padding:2px}.brand small{display:block;color:var(--muted);font-size:9px;letter-spacing:.1em}.menu{display:grid;gap:5px;padding-top:18px}.menu button{background:none;border:0;color:#c4d3d5;text-align:left;padding:11px;border-radius:8px}.menu button.active,.menu button:hover{background:#173746;color:var(--lime)}.demo-note{margin-top:auto;background:#2d291e;color:#f1d9aa;border:1px solid #ffba7740;border-radius:9px;padding:11px;font-size:10px;line-height:1.5}.main{min-width:0}.top{height:65px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px}.top small{display:block;color:var(--muted);font-size:10px}.pill{border:1px solid #c7f36b60;border-radius:20px;padding:6px 10px;color:var(--lime);font:9px monospace;letter-spacing:.08em}.content{max-width:1200px;margin:auto;padding:30px 28px 45px}.eyebrow{font:10px monospace;color:var(--teal);letter-spacing:.12em}.heading{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:7px 0 20px}.heading h1{font-size:29px;margin:0;letter-spacing:-.04em}.heading p,.muted{color:var(--muted);font-size:12px}.grid{display:grid;gap:12px}.stats{grid-template-columns:repeat(4,1fr);margin-bottom:13px}.cols{grid-template-columns:1.2fr .8fr}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}.card h2{font-size:15px;margin:0 0 9px}.metric{font-weight:700;font-size:23px;margin:8px 0}.label{font:9px monospace;color:var(--muted);letter-spacing:.08em}.good{color:var(--lime)}.warn{color:var(--amber)}.action,.secondary{background:var(--lime);color:#071824;border:0;border-radius:7px;padding:10px 13px;font-size:12px;font-weight:700}.secondary{background:transparent;color:var(--white);border:1px solid var(--line)}.chart{height:135px;margin:12px 0}.chart svg{width:100%;height:100%}.form{display:flex;gap:9px;align-items:end;flex-wrap:wrap;margin:12px 0}.field{flex:1;min-width:125px}.field label{display:block;color:var(--muted);font-size:10px;margin-bottom:5px}.field input{width:100%;padding:9px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--white)}.notice{margin-top:11px;padding:11px;background:#30291e;border-left:2px solid var(--amber);border-radius:0 7px 7px 0;color:#ead8b5;font-size:10px;line-height:1.5}.steps{display:flex;gap:6px;margin:12px 0}.step{flex:1;text-align:center;background:var(--bg);border:1px solid var(--line);border-radius:7px;color:var(--muted);padding:8px 3px;font-size:9px}.step.on{color:var(--lime);border-color:#c7f36b77}.tablewrap{overflow:auto}.table{border-collapse:collapse;width:100%;min-width:580px;font-size:11px}.table th{text-align:left;color:var(--muted);font:9px monospace;text-transform:uppercase;padding:10px;border-bottom:1px solid var(--line)}.table td{padding:11px 10px;border-bottom:1px solid var(--line)}.badge{font:9px monospace;color:var(--lime);background:#c7f36b1b;border-radius:15px;padding:4px 7px}.result{font-size:27px;font-weight:700;color:var(--lime)}.line{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding:11px 0;font-size:12px}.line span{color:var(--muted)}.footer{border-top:1px solid var(--line);padding:14px 28px;color:#83979d;font-size:9px}
@media(max-width:800px){.layout{grid-template-columns:175px 1fr}.stats{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}}@media(max-width:600px){.layout{display:block}.side{position:sticky;top:0;z-index:3;padding:8px;border-right:0;border-bottom:1px solid var(--line)}.brand,.demo-note{display:none}.menu{display:flex;overflow:auto;padding:0}.menu button{white-space:nowrap;padding:9px;font-size:11px}.top{height:52px;padding:0 14px}.content{padding:20px 13px 35px}.heading{display:block}.heading h1{font-size:24px}.heading .action,.heading .secondary{margin-top:10px}.stats{gap:8px}.card{padding:12px}.metric{font-size:20px}.form .action{width:100%}.footer{padding:12px}}

const s={view:'inicio',hourly:25000,ded:1,limit:500000,used:0,pending:null,events:[{id:'DEMO-001',date:'12 oct · 10:04',type:'Prueba de latencia',duration:.4,estimate:0,status:'Cerrado',detail:'Menor al deducible'}]};const $=x=>document.querySelector(x),fmt=n=>new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:0}).format(n),rnd=n=>Number(n.toFixed(1));
function chart(){return `<div class="chart"><svg viewBox="0 0 650 150" preserveAspectRatio="none"><path d="M0 25H650M0 65H650M0 105H650M0 145H650" stroke="#ffffff15"/><path d="M0 24Q100 20 200 25T315 24L350 117H430L455 25Q550 21 650 24" fill="none" stroke="#75e2cf" stroke-width="3"/><text x="359" y="104" fill="#c7f36b" font-size="10" font-family="monospace">EVENTO SIMULADO</text></svg></div>`}
function sim(){return `<div class="card"><h2>Simula una caída ficticia</h2><p class="muted">Cambia la duración y ventas. Después detecta el evento y valida el cálculo de demostración.</p><div class="form"><div class="field"><label>Caída (horas)</label><input id="hours" type="number" min="0.1" step="0.5" value="6"></div><div class="field"><label>Ventas promedio por hora</label><input id="sales" type="number" min="0" step="1000" value="${s.hourly}"></div><button class="action" data-act="detect">Detectar evento</button></div>${s.pending?pending():`<div class="notice">Business demo: deducible de tiempo 1 h. No genera un siniestro ni un pago.</div>`}</div>`}
function pending(){const p=s.pending;return `<div class="steps"><div class="step on">1 · Detectada</div><div class="step ${p.valid?'on':''}">2 · Validada</div><div class="step ${p.valid?'on':''}">3 · Estimación</div></div>${p.valid?`<div class="result">${fmt(p.amount)}</div><p class="muted">${rnd(Math.max(0,p.hours-s.ded))} h después del deducible × ${fmt(p.hourly)} por hora. Estimación ficticia, no indemnización.</p>`:`<button class="action" data-act="validate">Validar datos de ejemplo</button>`}`}
function heading(k,title,desc,extra=''){return `<div class="eyebrow">${k}</div><div class="heading"><div><h1>${title}</h1><p>${desc}</p></div>${extra}</div>`}
function rows(){return s.events.map(e=>`<tr><td>${e.id}</td><td>${e.date}</td><td>${e.type}</td><td>${rnd(e.duration)} h</td><td>${e.detail}</td><td><span class="badge">${e.status}</span></td></tr>`).join('')}
function home(){return `${heading('PANEL DE CONTROL · TIENDA FICTICIA','Hola, Brinco','Explora el monitoreo y simula un evento sin conectarte a sistemas reales.',`<button class="secondary" data-act="reset">Reiniciar demo</button>`)}<div class="grid stats"><div class="card"><div class="label">Estado del sitio</div><div class="metric ${s.pending&&!s.pending.valid?'warn':'good'}">${s.pending&&!s.pending.valid?'Caída detectada':'Operativo'}</div><small class="muted">Estado de demostración</small></div><div class="card"><div class="label">Disponibilidad (demo)</div><div class="metric">${s.pending&&!s.pending.valid?'96.8%':'99.98%'}</div><small class="muted">No es una medición real</small></div><div class="card"><div class="label">Simulaciones</div><div class="metric">${s.events.length-1}</div><small class="muted">En esta sesión</small></div><div class="card"><div class="label">Límite ilustrativo restante</div><div class="metric">${fmt(Math.max(0,s.limit-s.used))}</div><small class="muted">No es una póliza vigente</small></div></div><div class="grid cols"><div class="card"><h2>Salud web</h2><p class="muted">Gráfica ilustrativa de disponibilidad</p>${chart()}</div><div class="card"><h2>Pasos de validación</h2><div class="steps"><div class="step ${s.pending?'on':''}">Detectar</div><div class="step ${s.pending?.valid?'on':''}">Validar</div><div class="step ${s.pending?.valid?'on':''}">Estimar</div></div><p class="muted">Fórmula: (horas cubiertas − deducible) × ventas promedio por hora.</p><div class="notice">RTO propuesto: recuperación en hasta 2 h. Es una meta operativa, no una garantía.</div></div></div><div style="margin-top:13px">${sim()}</div>`}
function monitoring(){return `${heading('MONITOREO · SIMULACIÓN LOCAL','Salud web','En una versión conectada, sondas y APIs recibirían datos de disponibilidad. Aquí puedes probar el flujo.') }<div class="grid cols"><div class="card"><h2>Semáforo de disponibilidad</h2><div class="metric ${s.pending&&!s.pending.valid?'warn':'good'}">● ${s.pending&&!s.pending.valid?'Interrupción detectada':'Operativo'}</div><p class="muted">${s.pending?`Caída de prueba: ${rnd(s.pending.hours)} h`:'Esperando una simulación local'}</p>${chart()}</div>${sim()}</div>`}
function incidents(){return `${heading('BITÁCORA · DATOS FICTICIOS','Registro de incidentes','Consulta la prueba inicial y los eventos que simules.',`<button class="action" data-view="inicio">Abrir simulador</button>`)}<div class="card tablewrap"><table class="table"><thead><tr><th>ID</th><th>Fecha demo</th><th>Evento</th><th>Duración</th><th>Resultado</th><th>Estado</th></tr></thead><tbody>${rows()}</tbody></table></div><div class="notice">Los eventos se guardan solo durante esta sesión en tu navegador. No se envían a ninguna aseguradora.</div>`}
function policy(){return `${heading('PLAN BUSINESS · EJEMPLO','Póliza y cobertura','Vista ficticia de límites, deducibles y condiciones.') }<div class="grid cols"><div class="card"><h2>Coberturas de ejemplo</h2><div class="line"><b>Ventas no realizadas</b><span>Hasta $500,000 anual</span></div><div class="line"><b>Respuesta a ciberataque</b><span>Sublímite $150,000</span></div><div class="line"><b>Filtración de datos</b><span>Sublímite $100,000</span></div><div class="line"><b>Restauración</b><span>Sublímite $100,000</span></div></div><div class="card"><h2>Deducibles y requisitos</h2><div class="line"><b>Ventas interrumpidas</b><span>1 hora</span></div><div class="line"><b>Gastos cyber</b><span>$10,000</span></div><div class="line"><b>Controles mínimos</b><span>SSL · 2FA · parches</span></div><div class="line"><b>Exclusiones demo</b><span>Mantenimiento · impago</span></div><div class="notice">Muestra académica: los términos reales dependerían de una póliza autorizada y contratada.</div></div></div>`}
function reports(){const incidents=s.events.filter(e=>e.id!=='DEMO-001'),hours=incidents.reduce((a,e)=>a+e.duration,0),amount=incidents.reduce((a,e)=>a+e.estimate,0);return `${heading('REPORTES · RESUMEN LOCAL','Actividad de la demo','Indicadores de las simulaciones que hiciste en esta sesión.',`<button class="secondary" data-act="reset">Reiniciar demo</button>`)}<div class="grid stats"><div class="card"><div class="label">Eventos simulados</div><div class="metric">${incidents.length}</div></div><div class="card"><div class="label">Horas de caída de prueba</div><div class="metric">${rnd(hours)} h</div></div><div class="card"><div class="label">Estimación total</div><div class="metric">${fmt(amount)}</div><small class="muted">No equivale a pago</small></div><div class="card"><div class="label">Meta RTO</div><div class="metric">≤ 2 h</div><small class="muted">Objetivo, no promesa</small></div></div><div class="card"><h2>Detalle de eventos</h2><div class="tablewrap"><table class="table"><thead><tr><th>Evento</th><th>Duración</th><th>Estimación local</th></tr></thead><tbody>${incidents.length?incidents.map(e=>`<tr><td>${e.id}</td><td>${rnd(e.duration)} h</td><td>${fmt(e.estimate)}</td></tr>`).join(''):`<tr><td colspan="3">Aún no hay simulaciones. Ve a Inicio para probar una.</td></tr>`}</tbody></table></div></div>`}
function storeDemo(){return heading("TIENDA FICTICIA · BRINCO","Brinco dentro de CyberCom Console","Explora la tienda demostrativa que usamos como ejemplo para mostrar el monitoreo de una insurtech.")+"<div class=\"card\"><div class=\"store-help\"><span class=\"muted\">Esta tienda de muestra funciona dentro del demo. Puedes recorrer el catálogo y probar su asistente.</span><a href=\"brinco/index.html\" target=\"_blank\" rel=\"noopener\">Abrir Brinco en otra pestaña ↗</a></div><iframe class=\"store-frame\" title=\"Tienda ficticia Brinco integrada en CyberCom Console\" src=\"brinco/index.html\"></iframe></div><div class=\"notice\">Brinco es una tienda de ejemplo. Su catálogo, chatbot, bolsa y precios son demostrativos; no se procesan pagos ni pedidos reales.</div>"};const pages={inicio:home,monitoreo:monitoring,incidentes,poliza,reportes,tienda:storeDemo};function render(){document.querySelectorAll('.menu button').forEach(b=>b.classList.toggle('active',b.dataset.view===s.view));$('#content').innerHTML=pages[s.view]()}
function detect(){const hours=Number($('#hours')?.value),hourly=Number($('#sales')?.value);if(!(hours>0)||!(hourly>=0)){alert('Ingresa una duración mayor que cero y ventas válidas.');return}s.hourly=hourly;s.pending={id:`DEMO-${String(s.events.length).padStart(3,'0')}`,date:new Date().toLocaleString('es-MX'),hours,hourly,valid:false,amount:0};render()}
function validate(){if(!s.pending)return;const hours=Math.max(0,s.pending.hours-s.ded),raw=hours*s.pending.hourly,amount=Math.min(raw,Math.max(0,s.limit-s.used));s.pending.valid=true;s.pending.amount=amount;s.used+=amount;s.events.unshift({id:s.pending.id,date:s.pending.date,type:'Caída simulada',duration:s.pending.hours,detail:`${hours} h elegibles · estimación ${fmt(amount)}`,estimate:amount,status:'Validado demo'});render()}
function reset(){s.pending=null;s.hourly=25000;s.used=0;s.events=[{id:'DEMO-001',date:'12 oct · 10:04',type:'Prueba de latencia',duration:.4,estimate:0,status:'Cerrado',detail:'Menor al deducible'}];render()}
document.querySelector('.menu').addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(b){s.view=b.dataset.view;render()}});$('#content').addEventListener('click',e=>{const b=e.target.closest('[data-act],[data-view]');if(!b)return;if(b.dataset.act==='detect')detect();if(b.dataset.act==='validate')validate();if(b.dataset.act==='reset')reset();if(b.dataset.view){s.view=b.dataset.view;render()}});render();
</script></body></html>
